name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build BOOTX64.EFI
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnu-efi binutils

      - name: Build TinyBoot
        run: make

      - name: Check EFI output
        run: test -f build/BOOTX64.EFI
